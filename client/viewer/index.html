<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:" />
    <title>ScreenLink</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <video id="video" autoplay muted playsinline disablepictureinpicture></video>
    <!-- Separate from the video on purpose: see Fanout in shared/rtc.js (no A/V sync). -->
    <audio id="audio" autoplay></audio>

    <div id="status" class="status">
      <div class="spinner"></div>
      <p id="status-text">Conectando…</p>
    </div>

    <header id="bar" class="bar">
      <div class="who">
        <span id="avatar" class="avatar"></span>
        <div>
          <div id="title" class="title"></div>
          <div id="route" class="route"></div>
        </div>
      </div>
      <div class="actions">
        <button id="stats-btn" title="Estatísticas (I)">Estatísticas</button>
        <button id="fit-btn" title="Ajustar ou pixels 1:1 (O)">Ajustar</button>
        <button id="fs-btn" title="Tela cheia (F11, duplo clique)">Tela cheia</button>
      </div>
    </header>

    <aside id="stats" class="stats" hidden></aside>

    <!-- Right-click menu -->
    <div id="menu" class="menu" role="menu" hidden>
      <div class="menu-volume">
        <button id="mute-toggle" class="icon" title="Silenciar (M)"></button>
        <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
        <span id="volume-out" class="volume-out"></span>
      </div>
      <p id="no-audio" class="menu-note" hidden>Esta transmissão não tem áudio</p>
      <div class="sep"></div>
      <button data-action="fullscreen" role="menuitem">Tela cheia <kbd>F11</kbd></button>
      <button data-action="stats" role="menuitem">Estatísticas <kbd>I</kbd></button>
      <button data-action="fit" role="menuitem">Pixels 1:1 <kbd>O</kbd></button>
    </div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
