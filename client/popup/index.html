<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>ScreenLink</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <span id="avatar" class="avatar"><i class="dot"></i></span>
      <div class="text">
        <div id="headline" class="headline"></div>
        <div id="detail" class="detail"></div>
      </div>
      <div class="actions">
        <button id="watch" class="primary">Assistir</button>
        <button id="dismiss">Dispensar</button>
      </div>
      <div class="timer"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
