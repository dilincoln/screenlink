# Builds the desktop app for Linux and Windows. Pushing a tag like v0.2.0 runs the tests, builds
# both platforms with that version and publishes a GitHub release with the installers. Running it
# by hand (Actions → Release → Run workflow) only builds and keeps the files as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # One Linux format per job: electron-builder packs targets one after another, so three in
        # one job took twice as long as the Windows build.
        include:
          - name: Linux AppImage
            os: ubuntu-24.04
            platform: --linux AppImage
            files: dist/*.AppImage
          - name: Linux deb
            os: ubuntu-24.04
            platform: --linux deb
            files: dist/*.deb
          - name: Linux pacman
            os: ubuntu-24.04
            platform: --linux pacman
            files: dist/*.pacman
          - name: Windows
            os: windows-2025
            platform: --win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The .pacman target packs with bsdtar.
      - if: matrix.name == 'Linux pacman'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: bun install --frozen-lockfile

      # The tag is the version: v0.2.0 -> 0.2.0 in the installers and in the app.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bun -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.GITHUB_REF_NAME.slice(1);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - run: bunx electron-builder ${{ matrix.platform }} --publish never

      # The native audio capture must load from inside the packaged app (asar unpacked). A short
      # exclude-mode capture is informative only: CI machines may have no audio device.
      - if: runner.os == 'Windows'
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          ./dist/win-unpacked/ScreenLink.exe -e '
            const { LoopbackCapture } = require(process.cwd() + "/dist/win-unpacked/resources/app.asar/node_modules/loopback-capture");
            console.log("loopback-capture loaded");
            try {
              const capture = new LoopbackCapture();
              let bytes = 0;
              capture.start(process.pid, false, (chunk) => (bytes += chunk.length));
              setTimeout(() => { capture.stop(); console.log("exclude-mode capture: " + bytes + " bytes in 2 s"); process.exit(0); }, 2000);
            } catch (err) {
              console.log("exclude-mode capture unavailable here: " + err.message);
            }
          '

      - uses: actions/upload-artifact@v7
        with:
          name: screenlink-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScreenLink $GITHUB_REF_NAME" \
            --generate-notes
