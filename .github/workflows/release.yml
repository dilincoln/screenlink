# Builds the desktop app for Linux and Windows. Every push to main is a new version: it runs the
# tests, builds both platforms and publishes a GitHub release (and its tag) with the installers.
# Running it by hand (Actions → Release → Run workflow) only builds and keeps the files as workflow
# artifacts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two quick pushes can't both pick the same version. A push that arrives
# while another is waiting replaces it; the newer commit contains the older one anyway.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The next patch after the latest v* tag (v0.4.1 -> 0.4.2). Raising "version" in package.json
  # above that starts a new minor or major: 0.5.0 there makes the next release 0.5.0.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          pkg=$(jq -r .version package.json)
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          next=$pkg
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "${last#v}"
            next=$(printf '%s\n%s\n' "$pkg" "$major.$minor.$((patch + 1))" | sort -V | tail -1)
          fi
          echo "Releasing $next (latest tag: ${last:-none}, package.json: $pkg)"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build (${{ matrix.name }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: --linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.pacman
          - name: Windows
            os: windows-2025
            platform: --win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The .pacman target packs with bsdtar.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: bun install --frozen-lockfile

      # The computed version goes into the installers and the app.
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - run: bunx electron-builder ${{ matrix.platform }} --publish never

      # The native audio capture must load from inside the packaged app (asar unpacked). A short
      # exclude-mode capture is informative only: CI machines may have no audio device.
      - if: runner.os == 'Windows'
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          ./dist/win-unpacked/ScreenLink.exe -e '
            const { LoopbackCapture } = require(process.cwd() + "/dist/win-unpacked/resources/app.asar/node_modules/loopback-capture");
            console.log("loopback-capture loaded");
            try {
              const capture = new LoopbackCapture();
              let bytes = 0;
              capture.start(process.pid, false, (chunk) => (bytes += chunk.length));
              setTimeout(() => { capture.stop(); console.log("exclude-mode capture: " + bytes + " bytes in 2 s"); process.exit(0); }, 2000);
            } catch (err) {
              console.log("exclude-mode capture unavailable here: " + err.message);
            }
          '

      - uses: actions/upload-artifact@v7
        with:
          name: screenlink-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      # Creates the tag on the pushed commit. A tag made with this token starts no new run.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ScreenLink $TAG" \
            --generate-notes
