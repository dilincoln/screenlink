      .cmsg .av { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font: 700 28px Inter; }

      .cmsg .tm { font: 500 19px Inter; color: #8d939e; margin-left: 12px; }
      .cmsg .tx { font: 400 34px/1.34 Inter; color: #e3e5e8; }
      .cmsg.cont { padding-top: 0; }
      .cmsg.cont .av { visibility: hidden; height: 0; }
      .toast-app { position: absolute; padding: 14px 24px; border-radius: 12px; background: #eef0f6; color: #111318; font: 600 24px Inter; box-shadow: 0 10px 34px rgba(0,0,0,.35); white-space: nowrap; }
