<!doctype html>
<!-- Still frames of the made-up windows (the game, the TCC slides, a browser), 1920×1080.
     capture.ts screenshots them for the share picker's thumbnails and the "photo of the
     screen" meme. ?scene=game&t=1.9 | ?scene=slides | ?scene=browser -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <script src="../assets/js/game.js"></script>
    <script src="../assets/js/slide.js"></script>
    <style>
      @font-face { font-family: "Press Start 2P"; src: url("../assets/fonts/PressStart2P-Regular.ttf"); }
      @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter.ttf"); font-weight: 100 900; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #stage { position: relative; width: 1920px; height: 1080px; }
      .browser { position: absolute; inset: 0; background: #f6f7fa; font-family: Inter, sans-serif; }
      .browser .top { height: 96px; background: #e6e8ee; display: flex; align-items: center; gap: 18px; padding: 0 28px; }
      .browser .dot { width: 22px; height: 22px; border-radius: 50%; background: #c9ced8; }
      .browser .url { flex: 1; height: 52px; border-radius: 26px; background: #fff; margin-left: 20px; }
      .browser .hero { margin: 90px 160px 0; height: 300px; border-radius: 28px; background: #4f6bed; }
      .browser .row { display: flex; gap: 40px; margin: 50px 160px 0; }
      .browser .card { flex: 1; height: 330px; border-radius: 24px; background: #fff; box-shadow: 0 6px 24px #0001; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const scene = params.get("scene") ?? "game";
      const stage = document.getElementById("stage");
      document.fonts.load('30px "Press Start 2P"', "TRETA").then(() => {
        if (scene === "game") {
          const fight = gsap.timeline({ paused: true });
          SLGame.mount(stage).addTo(fight, 0);
          fight.seek(Number(params.get("t") ?? 1));
        } else if (scene === "slides") {
          SLSlide.mount(stage);
        } else {
          stage.innerHTML = `<div class="browser"><div class="top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="url"></i></div>
            <div class="hero"></div><div class="row"><i class="card"></i><i class="card"></i><i class="card"></i></div></div>`;
        }
        document.body.dataset.ready = "1";
      });
    </script>
  </body>
</html>
