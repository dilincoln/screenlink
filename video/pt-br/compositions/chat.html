          const tl = gsap.timeline({ paused: true });
          const msgs = [...list.querySelectorAll(".cmsg")];
          const bottomOf = (m) => m.offsetTop + m.offsetHeight;
          const timed = msgs.filter((m) => m.dataset.t);
          const first = msgs[msgs.indexOf(timed[0]) - 1];

          // The list scrolls so the newest message sits on the input box, like a real chat.
          tl.set(list, { y: VIEW_H - BOTTOM_PAD - bottomOf(first) }, 0);
          timed.forEach((m) => {
            const t = Number(m.dataset.t);
            tl.set(m, { opacity: 0 }, 0);
            tl.to(list, { y: VIEW_H - BOTTOM_PAD - bottomOf(m), duration: 0.2, ease: "power3.out" }, t);
            tl.fromTo(m, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, t);
          });

          // Opening move: the frame settles in.
          tl.fromTo("#ch-cam", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);

          // Bia typing.
          tl.fromTo("#ch-typing", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 5.05);
          tl.to("#ch-typing", { opacity: 0, duration: 0.1 }, 5.75);

          // Cursor to "Compartilhar tela", press.
          const cur = $("#ch-cursor");
          tl.fromTo(cur, { x: 1500, y: 1120 }, { x: 760, y: 720, duration: 0.9, ease: "power2.inOut" }, 6.3);
          tl.to(cur, { x: 300, y: 950, duration: 0.8, ease: "power3.inOut" }, 7.2);
          tl.to("#ch-share", { backgroundColor: "#4e5058", duration: 0.12 }, 7.85);
          tl.to(cur, { scale: 0.82, duration: 0.08, transformOrigin: "0 0" }, 7.95);
          tl.to("#ch-share", { scale: 0.95, duration: 0.08 }, 7.95);
          tl.to(cur, { scale: 1, duration: 0.12 }, 8.05);
          tl.to("#ch-share", { scale: 1, duration: 0.12 }, 8.05);

          // Blocked — lands on the bass hit.
          tl.fromTo("#ch-backdrop", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, 8.83);
          tl.fromTo("#ch-modal", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, 8.83);
          tl.fromTo("#ch-cam", { x: 0 }, { keyframes: [{ x: -22 }, { x: 18 }, { x: -12 }, { x: 8 }, { x: 0 }], duration: 0.35, immediateRender: false }, 8.85);
          tl.to(cur, { opacity: 0, duration: 0.2 }, 9.0);

          // "acorda, cara": hard punch-in on the error, a beat of silence on screen.
          tl.to("#ch-cam", { scale: 1.32, x: 0, y: -40, duration: 0.14, ease: "power4.out" }, 10.68);
          tl.fromTo("#ch-vig", { opacity: 0 }, { opacity: 0.85, duration: 0.14, immediateRender: false }, 10.68);
          tl.to("#ch-cam", { keyframes: [{ rotation: -1.2 }, { rotation: 1 }, { rotation: -0.6 }, { rotation: 0 }], duration: 0.4 }, 10.84);
          tl.to("#ch-cam", { scale: 1, y: 0, duration: 0.4, ease: "power3.inOut" }, 12.0);
          tl.to("#ch-vig", { opacity: 0, duration: 0.4 }, 12.0);
          tl.to("#ch-modal", { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" }, 12.0);
          tl.to("#ch-backdrop", { opacity: 0, duration: 0.25 }, 12.05);

          // Plan B: the phone photo of the monitor. Camera flash, then a look at it.
          tl.fromTo("#ch-flash", { opacity: 0.95 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 13.05);
          tl.to("#ch-cam", { scale: 1.42, x: -140, y: -60, duration: 0.45, ease: "power3.inOut" }, 13.25);
          tl.to("#ch-cam", { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power3.inOut" }, 13.95);

          // "já começou": the room gets darker and the camera creeps in.
          tl.to("#ch-vig", { opacity: 0.7, duration: 0.9, ease: "power2.out" }, 15.85);
          tl.to("#ch-cam", { scale: 1.09, y: -30, duration: 1.4, ease: "power2.inOut" }, 15.85);

          window.__timelines["chat"] = tl;
        });
      })();
    </script>
  </div>
</template>
